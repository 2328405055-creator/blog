<style>
:root{
  --bg:#080c14;--card:#0f1420;--card-hover:#161d2e;--border:#1c2438;
  --text:#bcc5d6;--title:#e2e8f4;--muted:#5e6d87;--blue:#4b8cf7;
  --cyan:#22c9d0;--purple:#9b72f2;--pink:#f07baa;--gold:#f0b85a;
  --green:#34c97d;--red:#f04b6e;--r:14px;--rs:8px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
#progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--cyan),var(--purple));z-index:200;transition:width 0.15s}
#particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Serif SC",serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--cyan);text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{position:relative;z-index:1}

/* ====== NAV ====== */
.nav{position:sticky;top:0;z-index:100;background:rgba(8,12,20,0.82);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,0.04)}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:56px}
.nav-logo{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:18px;font-weight:700;color:var(--title);letter-spacing:0.5px;background:none;border:none}
.nav-logo .icon{font-size:22px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.nav-logo span{background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nav-right{display:flex;align-items:center;gap:2px}
.nav-right a{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:18px;font-size:12px;color:var(--muted);transition:all 0.25s;border:1px solid transparent}
.nav-right a:hover{color:var(--title);background:var(--card);border-color:var(--border)}
.nav-right a.spotify:hover{color:#1DB954;border-color:#1DB95433;background:#1DB95411}
.nav-right a.bilibili:hover{color:#fb7299;border-color:#fb729933;background:#fb729911}
.nav-right svg{width:15px;height:15px}
.nav-tabs{display:flex;gap:3px;margin-left:6px}
.nav-tabs button{padding:6px 15px;border-radius:16px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;transition:all 0.25s;font-weight:500}
.nav-tabs button:hover{color:var(--title)}
.nav-tabs button.on,.nav-tabs button[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.ham-btn{display:none;background:none;border:none;color:var(--title);font-size:22px;cursor:pointer;padding:4px}

/* ====== LAYOUT ====== */
.page-wrap{max-width:1200px;margin:0 auto;padding:40px 28px 60px;display:grid;grid-template-columns:1fr 320px;gap:36px;align-items:start}
@media(max-width:900px){.page-wrap{grid-template-columns:1fr;gap:28px;padding:24px 20px 60px}}
.main-col{min-width:0}
.side-col{position:sticky;top:80px}

/* ====== HERO ====== */
.hero{text-align:center;padding:0 0 8px;grid-column:1/-1}
.site-name{font-size:40px;font-weight:800;color:var(--title);background:linear-gradient(135deg,var(--cyan)0%,var(--purple)50%,var(--pink)100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px}
.site-desc{font-size:14px;color:var(--muted);margin-top:8px;letter-spacing:3px;font-weight:300}

/* ====== QUOTE ====== */
.quote-card{background:linear-gradient(135deg,rgba(155,114,242,0.06)0%,rgba(34,201,208,0.04)100%);border:1px solid var(--border);border-radius:20px;padding:26px 28px 22px;position:relative;overflow:hidden;margin-bottom:0}
.quote-card::before{content:"";position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--purple),var(--cyan),transparent);opacity:0.5}
.quote-card .qm{font-size:32px;opacity:0.06;position:absolute;top:8px;left:14px;line-height:1}
.quote-card p{font-size:13px;color:#9ba9c6;line-height:2.2;text-align:center;position:relative;z-index:1;letter-spacing:0.6px}
.quote-card .q-act{display:flex;gap:6px;justify-content:center;margin-top:14px;position:relative;z-index:2}
.quote-card .q-act button{background:none;border:1px solid var(--border);color:var(--muted);padding:4px 12px;border-radius:12px;cursor:pointer;font-size:11px;transition:all 0.2s}
.quote-card .q-act button:hover{border-color:var(--cyan);color:var(--cyan)}
.quote-card .q-act button.done{border-color:var(--green);color:var(--green)}

/* ====== SIDEBAR CARDS ====== */
.side-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:14px;transition:border-color 0.3s}
.side-card:hover{border-color:rgba(255,255,255,0.08)}
.side-card .sc-title{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:10px;font-weight:600}
.side-card.date-card .sc-main{font-size:18px;font-weight:700;color:var(--cyan);margin-bottom:2px}
.side-card.date-card .sc-sub{font-size:12px;color:var(--muted)}
.side-card .sc-main{font-size:14px;color:var(--title);font-weight:600;line-height:1.5}
.side-card .sc-sub{font-size:12px;color:var(--muted);margin-top:4px}
.side-card .sc-btn{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:11px;transition:all 0.2s}
.side-card .sc-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.side-card .sc-input{width:100%;margin-top:8px;padding:7px 12px;border-radius:var(--rs);border:1px solid var(--border);background:var(--bg);color:var(--title);font-size:13px;outline:none}
.side-card .sc-input:focus{border-color:var(--cyan)}
.side-card .sc-fb{font-size:11px;margin-top:4px;min-height:16px}
.side-card .sc-fb.ok{color:var(--green)}
.side-card .sc-fb.no{color:var(--red)}

/* stats in sidebar */
.side-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side-stats .ss{text-align:center;padding:10px 8px;background:var(--bg);border-radius:var(--rs);border:1px solid transparent;transition:all 0.2s}
.side-stats .ss:hover{border-color:var(--border)}
.side-stats .ss .n{font-size:20px;font-weight:700;color:var(--cyan)}
.side-stats .ss .l{font-size:10px;color:var(--muted)}

/* side nav links */
.side-links{display:flex;flex-direction:column;gap:2px}
.side-links a{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:var(--rs);font-size:12px;color:var(--muted);transition:all 0.2s}
.side-links a:hover{background:var(--bg);color:var(--title)}

/* side rate */
.side-rate{text-align:center;padding:8px;font-size:13px;color:var(--muted)}
.side-rate .rv{color:var(--gold);font-weight:600;font-size:16px}

/* ====== MAIN CONTENT ====== */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.section-title{font-size:16px;font-weight:700;color:var(--title);letter-spacing:1px}

/* sub tags */
.sub-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.sub-btn{padding:5px 14px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;font-size:11px;transition:all 0.25s;font-weight:500}
.sub-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.sub-btn.on,.sub-btn[aria-pressed="true"]{background:rgba(34,201,208,0.1);border-color:var(--cyan);color:var(--cyan)}

/* search */
.search-wrap{margin-bottom:18px}
.search-wrap input{width:100%;padding:11px 18px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--title);font-size:14px;outline:none;transition:all 0.3s}
.search-wrap input:focus{border-color:var(--purple);box-shadow:0 0 20px rgba(155,114,242,0.05)}
.search-wrap input::placeholder{color:var(--muted)}

/* ====== OZON FEATURED POST (gold premium) ====== */
.featured-section{margin-bottom:22px;position:relative}
.featured-section::before{content:"";position:absolute;inset:-1px;border-radius:calc(var(--r)+1px);background:linear-gradient(135deg,rgba(240,184,90,0.25),rgba(240,184,90,0.05),rgba(212,166,60,0.2),rgba(240,184,90,0.05));z-index:-1;animation:fpGlow 3s ease-in-out infinite}
@keyframes fpGlow{0%,100%{opacity:0.5}50%{opacity:1}}
.featured-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.featured-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 14px;border-radius:14px;font-size:11px;font-weight:700;letter-spacing:0.5px}
.featured-badge.live{background:linear-gradient(135deg,rgba(240,184,90,0.2),rgba(240,184,90,0.08));border:1px solid rgba(240,184,90,0.4);color:var(--gold);animation:fpPulse 2s ease-in-out infinite}
.featured-badge.verified{border-color:rgba(52,201,125,0.5);background:linear-gradient(135deg,rgba(52,201,125,0.15),rgba(52,201,125,0.04));color:var(--green)}
.featured-badge svg{width:13px;height:13px}
@keyframes fpPulse{0%,100%{opacity:1}50%{opacity:0.7}}
.featured-post-card{background:linear-gradient(160deg,rgba(30,25,18,0.9),rgba(22,20,26,0.95),rgba(25,22,18,0.9));border:1.5px solid rgba(240,184,90,0.25);border-radius:var(--r);padding:0;cursor:pointer;transition:all 0.4s cubic-bezier(0.25,0.1,0.25,1);position:relative;overflow:hidden}
.featured-post-card::before{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 30% 0%,rgba(240,184,90,0.06) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(240,184,90,0.04) 0%,transparent 50%);pointer-events:none;z-index:0}
.featured-post-card::after{content:"";position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,rgba(240,184,90,0.6),rgba(240,184,90,0.2),transparent);z-index:1}
.featured-post-card:hover,.featured-post-card:focus-within{border-color:rgba(240,184,90,0.55);transform:translateY(-4px);box-shadow:0 24px 64px rgba(240,184,90,0.1),0 0 120px rgba(240,184,90,0.03)}
.featured-post-card .fp-inner{padding:22px 26px;position:relative;z-index:1}
.featured-post-card .fp-meta{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:11px;flex-wrap:wrap}
.featured-post-card .fp-tag{padding:3px 12px;border-radius:10px;font-size:10px;letter-spacing:0.8px;font-weight:700;text-transform:uppercase;background:linear-gradient(135deg,rgba(240,184,90,0.2),rgba(212,166,60,0.1));color:var(--gold);border:1px solid rgba(240,184,90,0.2)}
.featured-post-card .fp-date{color:var(--muted);font-size:11px}
.featured-post-card .fp-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:8px}
.featured-post-card h3{font-size:18px;color:var(--title);line-height:1.4;font-weight:700;margin:0;flex:1}
.featured-post-card .fp-score{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,rgba(240,184,90,0.15),rgba(240,184,90,0.05));border:2px solid rgba(240,184,90,0.35)}
.featured-post-card .fp-score .sval{font-size:18px;font-weight:800;color:var(--gold);line-height:1}
.featured-post-card .fp-score .slab{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
.featured-post-card .fp-products-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 12px}
@media(max-width:700px){.featured-post-card .fp-products-preview{grid-template-columns:1fr}}
.featured-post-card .fp-mini{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:10px 12px;transition:all 0.2s}
.featured-post-card .fp-mini:hover{background:rgba(240,184,90,0.06);border-color:rgba(240,184,90,0.2)}
.featured-post-card .fp-mini .fm-rank{font-size:9px;color:var(--gold);font-weight:700;letter-spacing:0.5px;margin-bottom:3px}
.featured-post-card .fp-mini .fm-name{font-size:12px;color:var(--title);font-weight:600;line-height:1.3;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.featured-post-card .fp-mini .fm-info{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--muted)}
.featured-post-card .fp-mini .fm-info .fm-price{color:var(--gold);font-weight:600}
.featured-post-card .fp-mini .fm-info .fm-rating{color:var(--green)}
.featured-post-card .fp-stats{display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding-top:8px;border-top:1px solid rgba(255,255,255,0.04)}
.featured-post-card .fp-stats span{display:flex;align-items:center;gap:5px}
.featured-post-card .fp-stats .fp-val{color:var(--title);font-weight:600}
.featured-post-card .fp-stats .fp-live{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);animation:fpPulse 1.5s ease-in-out infinite}

/* ====== OZON PRODUCT CARDS (in grid) ====== */
.ozon-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;cursor:pointer;transition:all 0.3s;position:relative;overflow:hidden}
.ozon-card:hover{background:var(--card-hover);border-color:rgba(240,184,90,0.3);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.ozon-card .oc-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ozon-card .oc-rank{font-size:18px;font-weight:800;color:var(--gold);flex-shrink:0;width:28px}
.ozon-card .oc-name{font-size:14px;font-weight:600;color:var(--title);line-height:1.3;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ozon-card .oc-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px}
.ozon-card .oc-meta .oc-price{color:var(--gold);font-weight:700;font-size:14px}
.ozon-card .oc-meta .oc-rating{color:var(--green)}
.ozon-card .oc-meta .oc-reviews{color:var(--muted)}
.ozon-card .oc-sku-row{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:10px}
.ozon-card .oc-sku{font-family:monospace;background:rgba(255,255,255,0.04);padding:2px 8px;border-radius:6px;color:var(--muted);font-size:10px}
.ozon-card .oc-trend{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 8px;border-radius:8px}
.ozon-card .oc-trend.up{background:rgba(52,201,125,0.1);color:var(--green)}
.ozon-card .oc-trend.hot{background:rgba(240,184,90,0.1);color:var(--gold)}

/* post grid - 2 columns on desktop */
.post-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:900px){.post-grid{grid-template-columns:1fr}}
.post-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;cursor:pointer;transition:all 0.35s cubic-bezier(0.25,0.1,0.25,1);position:relative;overflow:hidden}
.post-card::after{content:"";position:absolute;bottom:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--purple),var(--cyan),transparent);transform:scaleX(0);transition:transform 0.4s;opacity:0.3}
.post-card:hover,.post-card:focus-within{background:var(--card-hover);border-color:rgba(255,255,255,0.08);transform:translateY(-3px);box-shadow:0 16px 48px rgba(0,0,0,0.35)}
.post-card:hover::after,.post-card:focus-within::after{transform:scaleX(1)}
.post-card .p-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px;flex-wrap:wrap}
.post-card .p-tag{padding:2px 10px;border-radius:10px;font-size:10px;letter-spacing:0.5px;font-weight:500}
.post-card .p-date{color:var(--muted)}
.post-card .p-read{color:var(--muted);font-size:11px;margin-left:auto}
.post-card h3{font-size:16px;color:var(--title);margin-bottom:6px;line-height:1.4;font-weight:600}
.post-card .p-excerpt{font-size:13px;color:var(--muted);line-height:1.5}

/* ====== PAGINATION ====== */
.pager{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:24px}
.pager button{padding:8px 16px;border-radius:16px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;font-size:13px;transition:all 0.2s}
.pager button:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan)}
.pager button:disabled{opacity:0.3;cursor:default}
.pager button.pg-on{background:var(--cyan);border-color:var(--cyan);color:#000;font-weight:600}
.pager .pg-info{font-size:12px;color:var(--muted);padding:0 8px}

/* ====== ARTICLE VIEW ====== */
.article-full{grid-column:1/-1}
.article{animation:fadeIn 0.45s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.article .back-btn{display:inline-flex;align-items:center;gap:4px;color:var(--muted);cursor:pointer;font-size:13px;margin-bottom:12px;padding:6px 16px;border-radius:16px;border:1px solid transparent;transition:all 0.2s}
.article .back-btn:hover{color:var(--cyan);border-color:var(--border);background:var(--card)}
.article .toc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 22px;margin-bottom:24px}
.article .toc .toc-title{font-size:11px;font-weight:700;color:var(--title);margin-bottom:8px;letter-spacing:2px;text-transform:uppercase}
.article .toc a{display:block;color:var(--muted);font-size:13px;padding:5px 0 5px 6px;transition:all 0.2s;border-left:2px solid transparent;border-radius:0 4px 4px 0}
.article .toc a:hover{color:var(--cyan);border-left-color:var(--cyan);padding-left:14px;background:rgba(34,201,208,0.03)}
.article .toc a.toc-h3{padding-left:22px;font-size:12px}
.article h1{font-size:30px;color:var(--title);line-height:1.3;margin-bottom:12px;font-weight:700;letter-spacing:0.5px}
.article .art-meta{font-size:13px;color:var(--muted);margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.article .art-meta .art-source{color:var(--cyan)}
.article .content{font-size:16px;line-height:2;max-width:780px}
.article .content h2{font-size:22px;color:var(--title);margin:36px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);font-weight:600}
.article .content h3{font-size:18px;color:var(--cyan);margin:28px 0 8px;font-weight:600}
.article .content p{margin-bottom:14px}
.article .content ul,.article .content ol{margin:0 0 14px 24px}.article .content li{margin-bottom:6px}
.article .content blockquote{border-left:3px solid var(--purple);padding:12px 20px;margin:18px 0;background:rgba(155,114,242,0.04);border-radius:0 8px 8px 0;color:var(--muted)}
.article .content code{background:var(--card);padding:2px 8px;border-radius:4px;color:var(--cyan);font-size:0.9em}
.article .content pre{background:#0a0d14;padding:16px 20px;border-radius:var(--rs);overflow-x:auto;margin-bottom:14px;border:1px solid var(--border)}
.article .content pre code{background:none;padding:0;color:var(--text)}
.article .content table{width:100%;border-collapse:collapse;margin:14px 0}
.article .content td,.article .content th{border:1px solid var(--border);padding:10px 14px}
.article .content th{background:var(--card);color:var(--title);font-weight:600;font-size:13px}
.article .content a{color:var(--cyan)}
.article .content strong{color:var(--title)}
.article .content img{max-width:100%;border-radius:var(--rs)}
.article .share-row{display:flex;gap:8px;margin-top:36px;padding-top:18px;border-top:1px solid var(--border)}
.article .share-row button{padding:6px 16px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;font-size:12px;transition:all 0.2s}
.article .share-row button:hover{border-color:var(--cyan);color:var(--cyan)}

/* ====== SKELETON ====== */
.skeleton{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:900px){.skeleton{grid-template-columns:1fr}}
.skel-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;animation:pulse 1.8s ease-in-out infinite}
.skel-card .s-line{height:14px;background:var(--border);border-radius:6px;margin-bottom:10px}
.skel-card .s-line:nth-child(1){width:30%}
.skel-card .s-line:nth-child(2){width:80%}
.skel-card .s-line:nth-child(3){width:55%}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:0.8}}

/* ====== MISC ====== */
.error-box{text-align:center;padding:60px 20px}
.error-box button{padding:10px 24px;border-radius:18px;border:1px solid var(--cyan);background:transparent;color:var(--cyan);cursor:pointer;font-size:14px;margin:8px;transition:all 0.2s}
.error-box button:hover{background:rgba(34,201,208,0.08)}
.msg{text-align:center;padding:40px 20px;color:var(--muted)}
.footer{text-align:center;padding:32px 28px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);max-width:1200px;margin:0 auto;letter-spacing:1px;position:relative;z-index:1}
.footer .days{color:var(--cyan);font-weight:600}

/* ====== GAME OVERLAY ====== */
.game-overlay{position:fixed;inset:0;background:rgba(8,12,20,0.93);z-index:400;display:none;align-items:center;justify-content:center;flex-direction:column}
.game-overlay.on{display:flex}
.game-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:28px;width:400px;max-width:92vw;max-height:90vh;overflow-y:auto}
.game-panel h2{color:var(--title);text-align:center;margin-bottom:4px;font-size:18px}
.game-panel .g-sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:14px}
.game-close{display:block;width:100%;margin-top:16px;padding:10px;border-radius:var(--rs);border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:13px;transition:all 0.2s}
.game-close:hover{color:var(--red);border-color:var(--red)}

/* 数独 */
.sudoku-wrap{text-align:center}
.sudo-board{display:grid;grid-template-columns:repeat(9,1fr);gap:0;width:340px;max-width:100%;margin:12px auto;border:2px solid var(--title);border-radius:4px;user-select:none}
.sudo-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;cursor:pointer;background:var(--card);border:0.5px solid var(--border);transition:background 0.15s;color:var(--title)}
.sudo-cell.given{color:var(--cyan);font-weight:700}
.sudo-cell.selected{background:rgba(34,201,208,0.2)!important}
.sudo-cell.same-num{background:rgba(34,201,208,0.08)}
.sudo-cell.conflict{color:var(--red)!important;background:rgba(240,75,110,0.12)!important}
.sudo-cell:nth-child(3n){border-right:1.5px solid var(--title)}
.sudo-cell:nth-child(9n){border-right:0.5px solid var(--border)}
.sudo-cell:nth-child(n+19):nth-child(-n+27),.sudo-cell:nth-child(n+46):nth-child(-n+54){border-bottom:1.5px solid var(--title)}
.sudo-numpad{display:flex;gap:4px;justify-content:center;margin:8px 0;flex-wrap:wrap}
.sudo-numpad button{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:15px;font-weight:600;transition:all 0.15s}
.sudo-numpad button:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(34,201,208,0.06)}
.sudo-numpad button.erase{width:auto;padding:0 12px;font-size:12px;color:var(--red)}
.sudo-info{display:flex;gap:20px;justify-content:center;margin:8px 0;font-size:12px;color:var(--muted)}
.sudo-info span{color:var(--gold);font-weight:600}
.sudo-modes{display:flex;gap:6px;justify-content:center;margin:8px 0}
.sudo-modes button{padding:5px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;font-size:11px;transition:all 0.2s}
.sudo-modes button.on{border-color:var(--cyan);color:var(--cyan);background:rgba(34,201,208,0.08)}
.lb-table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
.lb-table th{color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--border);font-size:10px;letter-spacing:1px}
.lb-table td{padding:6px 8px;border-bottom:0.5px solid var(--border);color:var(--text)}
.lb-table tr:nth-child(1) td{color:var(--gold);font-weight:600}
.lb-table tr:nth-child(2) td{color:#c0c0c0}
.lb-table tr:nth-child(3) td{color:#cd7f32}
.lb-empty{text-align:center;padding:20px;color:var(--muted);font-size:12px}
.lb-tabs{display:flex;gap:4px;justify-content:center;margin:8px 0}
.lb-tabs button{padding:4px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;font-size:11px;transition:all 0.2s}
.lb-tabs button.on{border-color:var(--cyan);color:var(--cyan);background:rgba(34,201,208,0.08)}

/* ====== TODO OVERLAY ====== */
.todo-overlay{position:fixed;inset:0;background:rgba(8,12,20,0.92);z-index:400;display:none;align-items:center;justify-content:center}
.todo-overlay.on{display:flex}
.todo-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);width:500px;max-width:90vw;max-height:80vh;overflow-y:auto;padding:28px}
.todo-panel h2{color:var(--title);margin-bottom:16px}
.todo-panel .td-input-row{display:flex;gap:8px;margin-bottom:16px}
.todo-panel .td-input-row input{flex:1;padding:10px 14px;border-radius:var(--rs);border:1px solid var(--border);background:var(--bg);color:var(--title);font-size:14px;outline:none}
.todo-panel .td-input-row button{padding:10px 20px;border-radius:var(--rs);border:none;background:var(--cyan);color:#000;cursor:pointer;font-weight:600;font-size:13px}
.todo-panel .td-list{list-style:none}
.todo-panel .td-list li{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.todo-panel .td-list li.done .td-text{text-decoration:line-through;color:var(--muted)}
.todo-panel .td-list .td-toggle{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);cursor:pointer;flex-shrink:0}
.todo-panel .td-list li.done .td-toggle{background:var(--green);border-color:var(--green)}
.todo-panel .td-list .td-text{flex:1}
.todo-panel .td-list .td-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px}
.todo-panel .td-list .td-del:hover{color:var(--red)}
.todo-panel .td-pw-row{display:flex;gap:8px;margin-bottom:16px}
.todo-panel .td-pw-row input{flex:1;padding:10px 14px;border-radius:var(--rs);border:1px solid var(--border);background:var(--bg);color:var(--title);font-size:14px;outline:none}
.todo-panel .td-pw-row button{padding:10px 20px;border-radius:var(--rs);border:none;background:var(--purple);color:#fff;cursor:pointer;font-weight:600;font-size:13px}
.todo-panel .td-close{display:block;width:100%;margin-top:16px;padding:8px;border-radius:var(--rs);border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
.todo-panel .td-close:hover{color:var(--red);border-color:var(--red)}

/* ====== FLOATING BUTTONS ====== */
#toTop{position:fixed;bottom:32px;right:28px;z-index:150;width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(10px);transition:all 0.35s;pointer-events:none;backdrop-filter:blur(8px)}
#toTop.show{opacity:1;transform:translateY(0);pointer-events:auto}
#toTop:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 6px 24px rgba(34,201,208,0.12)}
.breath-btn{position:fixed;bottom:32px;right:80px;z-index:150;width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all 0.35s}
.breath-btn:hover{border-color:var(--purple);color:var(--purple);box-shadow:0 6px 24px rgba(155,114,242,0.12)}
.todo-nav-btn{padding:6px 12px!important;font-size:12px!important}

/* ====== BREATH ====== */
.breath-overlay{position:fixed;inset:0;background:rgba(8,12,20,0.88);z-index:300;display:none;align-items:center;justify-content:center}
.breath-overlay.on{display:flex}
.breath-circle{width:170px;height:170px;border-radius:50%;border:3px solid var(--purple);margin:0 auto 24px;display:flex;align-items:center;justify-content:center;transition:all 4s ease-in-out;color:var(--title);font-size:18px;letter-spacing:2px}
.breath-circle.inhale{transform:scale(1.5);border-color:var(--cyan);box-shadow:0 0 60px rgba(34,201,208,0.18)}
.breath-circle.hold{border-color:var(--gold)}
.breath-circle.exhale{transform:scale(0.8);border-color:var(--purple)}
.breath-close{color:var(--muted);cursor:pointer;font-size:13px;border:1px solid var(--border);padding:6px 22px;border-radius:16px;background:none}
.breath-close:hover{color:var(--red);border-color:var(--red)}

/* ====== MOBILE ====== */
@media(max-width:760px){
  .ham-btn{display:block}
  .nav-right .nav-tabs{display:none;position:absolute;top:56px;left:0;width:100%;background:rgba(8,12,20,0.96);backdrop-filter:blur(20px);flex-direction:column;padding:12px;gap:2px;border-bottom:1px solid var(--border)}
  .nav-right .nav-tabs.open{display:flex}
  .nav-right a span{display:none}
  .site-name{font-size:28px}
  .post-card h3{font-size:15px}
  .article h1{font-size:23px}
  .breath-btn{right:76px;bottom:84px}
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>

<script>
(function(){
  const c=document.getElementById('particles'),ctx=c.getContext('2d');let stars=[],w,h;
  function R(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}R();window.onresize=R;
  for(let i=0;i<100;i++)stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+0.4,o:Math.random(),s:Math.random()*0.004+0.0015});
  (function D(){ctx.clearRect(0,0,w,h);stars.forEach(s=>{s.o+=s.s;if(s.o>1||s.o<0)s.s*=-1;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(155,180,220,${s.o*0.55})`;ctx.fill()});requestAnimationFrame(D)})()
})();
</script>

  }

  // SIDEBAR
  html+=`<aside class="side-col" aria-label="侧边栏">`;

// ====== ARTICLE VIEW ======
async function showArticle(slug,cat){
  const wrap=document.getElementById('pageWrap');
  wrap.innerHTML=`<div class="article-full"><div class="skeleton" style="grid-template-columns:1fr">${Array(4).fill('<div class="skel-card"><div class="s-line"></div><div class="s-line"></div><div class="s-line"></div></div>').join('')}</div></div>`;
  window.scrollTo(0,0);
  try{
    const r=await fetch('posts/'+slug+'.md');if(!r.ok)throw Error('404');
    const md=await r.text(),post=posts.find(p=>p.slug===slug);
    const colors={'cross-border':'var(--cyan)','fitness':'var(--green)','ai-news':'var(--purple)'};
    const c=colors[cat]||'var(--cyan)';
    const toc=buildTOC(md);
    const shareURL=encodeURIComponent(`https://20020426.top/#post/${slug}/${cat}`);
    const shareTitle=encodeURIComponent(post?.title||'');
    wrap.innerHTML=`<div class="article-full"><article class="article" aria-label="文章详情"><button class="back-btn" onclick="switchTab('${cat}')">← 返回${catName(cat)}</button><h1>${post?.title||''}</h1><div class="art-meta"><span style="color:${c}">${SUB_NAMES[post?.sub]||catName(cat)}</span><span aria-hidden="true">·</span><span>${post?.date||''}</span><span aria-hidden="true">·</span><span>${readTime(md)}</span>${post?.source_name?`<span aria-hidden="true">·</span><span class="art-source">📰 ${post.source_name}</span>`:''}</div>${toc}<div class="content">${marked.parse(md)}</div><div class="share-row"><span style="font-size:12px;color:var(--muted);line-height:2">分享：</span><button onclick="navigator.clipboard.writeText('https://20020426.top/#post/${slug}/${cat}');this.textContent='✓ 已复制';setTimeout(()=>this.textContent='📋 复制链接',1500)">📋 复制链接</button><a href="https://twitter.com/intent/tweet?url=${shareURL}&text=${shareTitle}" target="_blank" rel="noopener" style="padding:6px 16px;border-radius:14px;border:1px solid var(--border);font-size:12px;color:var(--muted)">𝕏 分享</a></div></article></div>`;
    document.querySelectorAll('.content h2,.content h3').forEach(h=>{if(!h.id)h.id=h.textContent.replace(/[^\w一-鿿]/g,'-').toLowerCase()});
  }catch(e){
    wrap.innerHTML=`<div class="article-full"><div class="error-box"><p>文章加载失败</p><button onclick="switchTab('${cat}')">← 返回</button><button onclick="showArticle('${slug}','${cat}')">🔄 重试</button></div></div>`;
  }
}

function buildTOC(md){const hs=[...md.matchAll(/^(#{2,3})\s+(.+)$/gm)];if(hs.length<2)return'';let h='<nav class="toc" aria-label="文章目录"><div class="toc-title">📑 目录</div>';hs.forEach(m=>{const lv=m[1].length,t=m[2],id=t.replace(/[^\w一-鿿]/g,'-').toLowerCase();h+=`<a class="${lv===3?'toc-h3':''}" href="javascript:document.getElementById('${id}').scrollIntoView({behavior:'smooth'})">${lv===2?'●':'◦'} ${t}</a>`});h+='</nav>';return h}
marked.use({renderer:{heading(t){const id=t.text.replace(/[^\w一-鿿]/g,'-').toLowerCase();return`<h${t.depth} id="${id}">${t.text}</h${t.depth}>`}}});

// ====== ACTIONS ======
function copyQuote(){navigator.clipboard.writeText(QUOTE).then(()=>{const b=document.querySelector('.q-act button');b.textContent='✓ 已复制';b.classList.add('done');setTimeout(()=>{b.textContent='📋 复制';b.classList.remove('done')},2000)}).catch(()=>{})}
function revealXHY(){if(todayXHY.show){pickXHY();render()}else{todayXHY.show=true;render()}}
function checkRiddle(){const i=document.getElementById('riddleInput'),f=document.getElementById('riddleFeedback');if(!i||!f)return;const v=i.value.trim();if(!v)return;if(v===riddleAnswer){f.textContent='✅ 答对了！';f.className='sc-fb ok';setTimeout(()=>{pickZM();render()},1500)}else{f.textContent='❌ 不对，再试试';f.className='sc-fb no'}}
function switchTab(t){currentTab=t;currentSub='all';currentSearch='';currentPage=1;render();window.scrollTo(0,0);closeMenu()}
function switchSub(s){currentSub=s;currentPage=1;render()}
function onSearch(v){currentSearch=v;currentPage=1;render()}
function goPage(n){currentPage=Math.max(1,n);render();document.getElementById('articleList').scrollIntoView({behavior:'smooth'})}

function toggleMenu(){const m=document.getElementById('navMenu');m.classList.toggle('open');document.getElementById('hamBtn').setAttribute('aria-expanded',m.classList.contains('open'))}
function closeMenu(){document.getElementById('navMenu').classList.remove('open');document.getElementById('hamBtn').setAttribute('aria-expanded','false')}

// ====== SUDOKU GAME ======
const SUDO_BASE=[
  [5,3,4,6,7,8,9,1,2],[6,7,2,1,9,5,3,4,8],[1,9,8,3,4,2,5,6,7],
  [8,5,9,7,6,1,4,2,3],[4,2,6,8,5,3,7,9,1],[7,1,3,9,2,4,8,5,6],
  [9,6,1,5,3,7,2,8,4],[2,8,7,4,1,9,6,3,5],[3,4,5,2,8,6,1,7,9]
];
let sudoSolution=[],sudoBoard=[],sudoGiven=[],sudoSelected=null,sudoMode='easy',sudoTimer=0,sudoTimerId=null,sudoStarted=false,sudoDone=false;
const SUDO_DIFFS={easy:45,normal:35,hard:27};

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}}

function genSudo(){
  // Start from base, apply transformations
  let grid=SUDO_BASE.map(r=>[...r]);
  // Randomly: swap rows within each band, swap columns within each stack, swap bands, swap stacks, transpose, relabel
  const bands=[[0,1,2],[3,4,5],[6,7,8]],stacks=[[0,1,2],[3,4,5],[6,7,8]];
  for(let b of bands){shuffle(b);const[r1,r2,r3]=b;const t1=grid[r1],t2=grid[r2],t3=grid[r3];grid[r1]=t1;grid[r2]=t2;grid[r3]=t3}
  // Swap columns within stacks
  for(let s of stacks){shuffle(s);for(let r=0;r<9;r++){const vals=s.map(c=>grid[r][c]);s.forEach((c,i)=>{grid[r][c]=vals[i]})}}
  // Relabel
  const labels=[1,2,3,4,5,6,7,8,9];shuffle(labels);labels.unshift(0);
  for(let r=0;r<9;r++)for(let c=0;c<9;c++)grid[r][c]=labels[grid[r][c]];
  // Maybe transpose
  if(Math.random()>0.5){const t=[];for(let r=0;r<9;r++){t[r]=[];for(let c=0;c<9;c++)t[r][c]=grid[c][r]}grid=t}
  sudoSolution=grid;
  // Remove cells
  const count=SUDO_DIFFS[sudoMode];
  sudoGiven=Array(9).fill().map(()=>Array(9).fill(false));
  sudoBoard=grid.map(r=>[...r]);
  const cells=[];for(let r=0;r<9;r++)for(let c=0;c<9;c++)cells.push([r,c]);
  shuffle(cells);
  for(let i=0;i<81-count;i++){const[r,c]=cells[i];sudoBoard[r][c]=0}
  for(let r=0;r<9;r++)for(let c=0;c<9;c++)sudoGiven[r][c]=sudoBoard[r][c]!==0;
}

function startSudoku(){genSudo();sudoSelected=null;sudoTimer=0;sudoStarted=false;sudoDone=false;if(sudoTimerId)clearInterval(sudoTimerId);sudoTimerId=null;document.getElementById('sudoOverlay').classList.add('on');renderSudo()}
function closeSudoku(){if(sudoTimerId)clearInterval(sudoTimerId);document.getElementById('sudoOverlay').classList.remove('on')}
function startTimer(){if(sudoStarted)return;sudoStarted=true;sudoTimerId=setInterval(()=>{sudoTimer++;updateTimer()},1000)}
function updateTimer(){const el=document.getElementById('sudoTime');if(el)el.textContent=fmtTime(sudoTimer)}
function fmtTime(s){const m=Math.floor(s/60),sec=s%60;return m+':'+(sec<10?'0':'')+sec}

function selectCell(r,c){
  if(sudoDone||sudoGiven[r][c])return;startTimer();
  if(sudoSelected&&sudoSelected[0]===r&&sudoSelected[1]===c){sudoSelected=null;renderSudo();return}
  sudoSelected=[r,c];renderSudo();
}
function inputNum(n){
  if(!sudoSelected||sudoDone)return;const[r,c]=sudoSelected;
  if(sudoGiven[r][c])return;startTimer();
  sudoBoard[r][c]=n;renderSudo();
  if(checkWin()){sudoDone=true;if(sudoTimerId)clearInterval(sudoTimerId);saveScore();renderSudo()}
}
function eraseCell(){if(!sudoSelected||sudoDone)return;const[r,c]=sudoSelected;if(sudoGiven[r][c])return;sudoBoard[r][c]=0;renderSudo()}

function hasConflict(r,c){
  const v=sudoBoard[r][c];if(v===0)return false;
  for(let i=0;i<9;i++){if(i!==c&&sudoBoard[r][i]===v)return true;if(i!==r&&sudoBoard[i][c]===v)return true}
  const br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;
  for(let i=br;i<br+3;i++)for(let j=bc;j<bc+3;j++)if((i!==r||j!==c)&&sudoBoard[i][j]===v)return true;
  return false;
}
function checkWin(){for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(sudoBoard[r][c]!==sudoSolution[r][c])return false;return true}

function renderSudo(view='game'){
  const panel=document.getElementById('sudoPanel');let h='';
  if(view==='lb'){h=renderLB();panel.innerHTML=h;return}
  h+=`<h2>🧮 数独</h2><div class="g-sub">${sudoDone?'🎉 恭喜通关！':'填入1-9使每行/列/宫不重复'}</div>`;
  h+=`<div class="sudo-modes">`;
  ['easy','normal','hard'].forEach(m=>{h+=`<button class="${sudoMode===m?'on':''}" onclick="changeMode('${m}')">${m==='easy'?'😊 简单':m==='normal'?'🤔 普通':'🔥 困难'}</button>`});
  h+=`</div>`;
  h+=`<div class="sudo-info"><span>⏱ <span id="sudoTime">${fmtTime(sudoTimer)}</span></span><span>💡 ${SUDO_DIFFS[sudoMode]}</span><span><a href="javascript:renderSudo('lb')" style="color:var(--muted);font-size:12px">🏆 排行榜</a></span></div>`;
  h+=`<div class="sudo-board">`;
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){
    const v=sudoBoard[r][c];let cls='sudo-cell';
    if(sudoGiven[r][c])cls+=' given';
    if(sudoSelected&&sudoSelected[0]===r&&sudoSelected[1]===c)cls+=' selected';
    if(sudoSelected&&v>0&&v===sudoBoard[sudoSelected[0]][sudoSelected[1]]&&!(sudoSelected[0]===r&&sudoSelected[1]===c)&&sudoBoard[sudoSelected[0]][sudoSelected[1]]>0)cls+=' same-num';
    if(!sudoGiven[r][c]&&v>0&&hasConflict(r,c))cls+=' conflict';
    h+=`<div class="${cls}" onclick="selectCell(${r},${c})">${v>0?v:''}</div>`;
  }
  h+=`</div>`;
  if(!sudoDone){
    h+=`<div class="sudo-numpad">`;
    for(let n=1;n<=9;n++)h+=`<button onclick="inputNum(${n})">${n}</button>`;
    h+=`<button class="erase" onclick="eraseCell()">⌫ 清除</button>`;
    h+=`</div>`;
  }else{
    h+=`<div style="text-align:center;font-size:24px;margin:12px 0">🎉</div>`;
    h+=`<div style="text-align:center;color:var(--gold);font-size:14px">完成时间：${fmtTime(sudoTimer)}</div>`;
  }
  h+=`<button class="sc-btn" style="width:100%;margin-top:4px" onclick="startSudoku()">🔄 新游戏</button>`;
  h+=`<button class="game-close" onclick="closeSudoku()">关闭</button>`;
  panel.innerHTML=h;
}
function changeMode(m){sudoMode=m;startSudoku()}

// Leaderboard
function loadLB(){try{return JSON.parse(localStorage.getItem('sudoku_lb')||'[]')}catch(e){return[]}}
function saveScore(){
  const name=prompt('恭喜！请输入你的昵称：','玩家');
  if(!name)return;
  const lb=loadLB();lb.push({name:name.substring(0,10),mode:sudoMode,time:sudoTimer,date:new Date().toISOString().slice(0,10)});
  lb.sort((a,b)=>{const o={easy:0,normal:1,hard:2};return o[b.mode]-o[a.mode]||a.time-b.time});
  if(lb.length>50)lb.length=50;
  localStorage.setItem('sudoku_lb',JSON.stringify(lb));
}
function renderLB(lbMode=sudoMode){
  const lb=loadLB();const modes=['easy','normal','hard'];const names={easy:'简单',normal:'普通',hard:'困难'};
  let h=`<h2>🏆 排行榜</h2>`;
  h+=`<div class="lb-tabs">`;
  modes.forEach(m=>{h+=`<button class="${lbMode===m?'on':''}" onclick="renderLB('${m}')">${names[m]}</button>`});
  h+=`</div>`;
  const filtered=lb.filter(e=>e.mode===lbMode);
  if(!filtered.length){h+=`<div class="lb-empty">暂无记录，通关后上榜 🏅</div>`}
  else{
    h+=`<table class="lb-table"><tr><th>#</th><th>玩家</th><th>时间</th><th>日期</th></tr>`;
    filtered.slice(0,10).forEach((e,i)=>{h+=`<tr><td>${i+1}</td><td>${e.name}</td><td>${fmtTime(e.time)}</td><td>${e.date}</td></tr>`});
    h+=`</table>`;
  }
  h+=`<button class="sc-btn" style="width:100%;margin-top:8px" onclick="renderSudo('game')">← 返回游戏</button>`;
  h+=`<button class="game-close" onclick="closeSudoku()">关闭</button>`;
  return h;
}

document.getElementById('sudoOverlay').onclick=function(e){if(e.target===this)closeSudoku()};
document.addEventListener('keydown',e=>{
  if(!document.getElementById('sudoOverlay').classList.contains('on')||sudoDone)return;
  if(e.key>='1'&&e.key<='9')inputNum(parseInt(e.key));
  else if(e.key==='Backspace'||e.key==='Delete')eraseCell();
  else if(e.key==='ArrowUp'&&sudoSelected)selectCell(Math.max(0,sudoSelected[0]-1),sudoSelected[1]);
  else if(e.key==='ArrowDown'&&sudoSelected)selectCell(Math.min(8,sudoSelected[0]+1),sudoSelected[1]);
  else if(e.key==='ArrowLeft'&&sudoSelected)selectCell(sudoSelected[0],Math.max(0,sudoSelected[1]-1));
  else if(e.key==='ArrowRight'&&sudoSelected)selectCell(sudoSelected[0],Math.min(8,sudoSelected[1]+1));
  else return;e.preventDefault();
});
