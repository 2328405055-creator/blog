<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猫明之主小站</title>
<meta name="description" content="跨境电商实战 · 徒手健身 · AI资讯 · 小工具 — 安静学习，温柔生长。">
<meta name="keywords" content="跨境电商,Ozon,Yandex,俄罗斯,选品,健身,AI,歇后语,字谜">
<meta property="og:title" content="猫明之主小站">
<meta property="og:description" content="跨境电商实战 · 徒手健身 · AI资讯 · 小工具">
<meta property="og:type" content="website">
<meta name="theme-color" content="#080c14">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg:#080c14; --card:#0f1420; --card-hover:#161d2e;
  --border:#1c2438; --text:#bcc5d6; --title:#e2e8f4;
  --muted:#5e6d87; --blue:#4b8cf7; --cyan:#22c9d0;
  --purple:#9b72f2; --pink:#f07baa; --gold:#f0b85a;
  --green:#34c97d; --red:#f04b6e;
  --radius-sm:8px; --radius:14px; --radius-lg:20px;
}
*{margin:0;padding:0;box-sizing:border-box}

#progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--cyan),var(--purple));z-index:200;transition:width 0.15s}
#particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}

body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Serif SC",serif;
  background:var(--bg);color:var(--text);line-height:1.7;
  min-height:100vh;position:relative;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.app{position:relative;z-index:1}

/* ====== 导航 (Apple风格毛玻璃) ====== */
.nav{
  position:sticky;top:0;z-index:100;
  background:rgba(8,12,20,0.82);backdrop-filter:blur(24px) saturate(1.4);
  -webkit-backdrop-filter:blur(24px) saturate(1.4);
  border-bottom:1px solid rgba(255,255,255,0.05);
}
.nav-inner{
  max-width:960px;margin:0 auto;display:flex;
  align-items:center;justify-content:space-between;padding:0 24px;height:56px;
}
.nav-logo{display:flex;align-items:center;gap:8px;cursor:pointer;text-decoration:none;font-size:18px;font-weight:700;color:var(--title);letter-spacing:0.5px}
.nav-logo .icon{font-size:22px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.nav-logo span{background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nav-right{display:flex;align-items:center;gap:2px}
.nav-right a{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:18px;text-decoration:none;font-size:12px;color:var(--muted);transition:all 0.25s;border:1px solid transparent}
.nav-right a:hover{color:var(--title);background:var(--card);border-color:var(--border)}
.nav-right a.spotify:hover{color:#1DB954;border-color:#1DB95433;background:#1DB95411}
.nav-right a.bilibili:hover{color:#fb7299;border-color:#fb729933;background:#fb729911}
.nav-right svg{width:15px;height:15px}
.nav-tabs{display:flex;gap:3px;margin-left:6px}
.nav-tabs button{
  padding:6px 15px;border-radius:16px;border:1px solid transparent;
  background:transparent;color:var(--muted);cursor:pointer;
  font-size:13px;transition:all 0.25s;font-weight:500;
}
.nav-tabs button:hover{color:var(--title)}
.nav-tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* ====== 主容器 ====== */
.main{max-width:960px;margin:0 auto;padding:0 24px 80px}

/* ====== Hero ====== */
.hero{text-align:center;padding:56px 0 12px}
.site-name{font-size:40px;font-weight:800;color:var(--title);background:linear-gradient(135deg,var(--cyan)0%,var(--purple)50%,var(--pink)100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px}
.site-desc{font-size:14px;color:var(--muted);margin-top:8px;letter-spacing:3px;font-weight:300}

/* ====== 引言 ====== */
.quote-wrap{max-width:700px;margin:0 auto 40px}
.quote-card{
  background:linear-gradient(135deg,rgba(155,114,242,0.05)0%,rgba(34,201,208,0.03)100%);
  border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:32px 34px 28px;position:relative;overflow:hidden;
}
.quote-card::before{content:"";position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--purple),var(--cyan),transparent);opacity:0.4}
.quote-card .qm{font-size:36px;opacity:0.08;position:absolute;top:10px;left:16px;line-height:1}
.quote-card p{font-size:14px;color:#9ba9c6;line-height:2.3;text-align:center;position:relative;z-index:1;letter-spacing:0.8px}
.quote-card .q-act{position:absolute;bottom:10px;right:18px;display:flex;gap:8px;z-index:2}
.quote-card .q-act button{background:none;border:1px solid var(--border);color:var(--muted);padding:4px 12px;border-radius:12px;cursor:pointer;font-size:11px;transition:all 0.2s}
.quote-card .q-act button:hover{border-color:var(--cyan);color:var(--cyan)}
.quote-card .q-act button.done{border-color:var(--green);color:var(--green)}

/* ====== 小工具行 ====== */
.tools-row{
  display:grid;grid-template-columns:repeat(3,1fr);gap:16px;
  margin-bottom:40px;
}
@media(max-width:760px){.tools-row{grid-template-columns:1fr}}
.tool-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:22px 20px;
  transition:all 0.35s;position:relative;overflow:hidden;
}
.tool-card:hover{border-color:rgba(255,255,255,0.12);transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,0.2)}
.tool-card .t-label{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:8px}
.tool-card .t-main{font-size:15px;color:var(--title);font-weight:600;line-height:1.5}
.tool-card .t-sub{font-size:12px;color:var(--muted);margin-top:4px}
.tool-card .t-action{display:inline-block;margin-top:10px;padding:5px 14px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:11px;transition:all 0.2s}
.tool-card .t-action:hover{border-color:var(--cyan);color:var(--cyan)}
.tool-card.date-card .t-main{font-size:28px;font-weight:700;color:var(--cyan)}
.tool-card.date-card .t-sub{font-size:13px;color:var(--muted);margin-top:2px}
.tool-card.riddle-card .t-main{font-size:18px;letter-spacing:1px}
.tool-card.riddle-card .t-input{width:100%;margin-top:10px;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--title);font-size:14px;outline:none;transition:border-color 0.2s}
.tool-card.riddle-card .t-input:focus{border-color:var(--cyan)}
.tool-card.riddle-card .t-feedback{font-size:12px;margin-top:6px;min-height:18px}
.tool-card.riddle-card .t-feedback.correct{color:var(--green)}
.tool-card.riddle-card .t-feedback.wrong{color:var(--red)}

/* ====== 统计 ====== */
.stats-row{display:flex;gap:16px;justify-content:center;margin-bottom:32px}
.stat-item{
  text-align:center;padding:16px 28px;background:var(--card);
  border:1px solid var(--border);border-radius:var(--radius);
  transition:all 0.3s;cursor:default;
}
.stat-item:hover{border-color:var(--purple);transform:translateY(-2px);box-shadow:0 8px 25px rgba(155,114,242,0.06)}
.stat-num{font-size:30px;font-weight:700;color:var(--cyan)}
.stat-label{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:1px}

/* ====== 子标签 ====== */
.sub-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;justify-content:center}
.sub-btn{
  padding:7px 18px;border-radius:18px;border:1px solid var(--border);
  background:var(--card);color:var(--muted);cursor:pointer;
  font-size:12px;transition:all 0.25s;font-weight:500;
}
.sub-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.sub-btn.on{background:rgba(34,201,208,0.1);border-color:var(--cyan);color:var(--cyan)}

/* ====== 搜索 ====== */
.search-wrap{margin-bottom:24px}
.search-wrap input{
  width:100%;max-width:520px;margin:0 auto;display:block;
  padding:12px 20px;border-radius:24px;
  border:1px solid var(--border);background:var(--card);
  color:var(--title);font-size:14px;outline:none;
  transition:all 0.3s;backdrop-filter:blur(8px);
}
.search-wrap input:focus{border-color:var(--purple);box-shadow:0 0 24px rgba(155,114,242,0.06)}
.search-wrap input::placeholder{color:var(--muted)}

/* ====== 文章卡片 ====== */
.post-grid{display:grid;gap:14px}
.post-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:22px 26px;cursor:pointer;
  transition:all 0.35s cubic-bezier(0.25,0.1,0.25,1);
  position:relative;overflow:hidden;
}
.post-card::after{content:"";position:absolute;bottom:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--purple),var(--cyan),transparent);transform:scaleX(0);transition:transform 0.4s;opacity:0.3}
.post-card:hover{background:var(--card-hover);border-color:rgba(255,255,255,0.08);transform:translateY(-3px);box-shadow:0 16px 48px rgba(0,0,0,0.35)}
.post-card:hover::after{transform:scaleX(1)}
.post-card .p-meta{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:12px;flex-wrap:wrap}
.post-card .p-tag{padding:3px 10px;border-radius:10px;font-size:11px;letter-spacing:0.5px;font-weight:500}
.post-card .p-date{color:var(--muted)}
.post-card .p-read{color:var(--muted);font-size:11px}
.post-card h3{font-size:17px;color:var(--title);margin-bottom:6px;line-height:1.4;font-weight:600}
.post-card .p-excerpt{font-size:13px;color:var(--muted);line-height:1.6}

/* ====== 文章详情 ====== */
.article{animation:fadeIn 0.45s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.article .back-btn{display:inline-flex;align-items:center;gap:4px;color:var(--muted);cursor:pointer;font-size:13px;margin-bottom:12px;padding:6px 16px;border-radius:16px;border:1px solid transparent;transition:all 0.2s}
.article .back-btn:hover{color:var(--cyan);border-color:var(--border);background:var(--card)}
.article .toc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:28px}
.article .toc .toc-title{font-size:12px;font-weight:700;color:var(--title);margin-bottom:10px;letter-spacing:2px;text-transform:uppercase}
.article .toc a{display:block;color:var(--muted);text-decoration:none;font-size:13px;padding:5px 0 5px 6px;transition:all 0.2s;border-left:2px solid transparent;border-radius:0 4px 4px 0}
.article .toc a:hover{color:var(--cyan);border-left-color:var(--cyan);padding-left:14px;background:rgba(34,201,208,0.03)}
.article .toc a.toc-h3{padding-left:22px;font-size:12px}
.article h1{font-size:30px;color:var(--title);line-height:1.3;margin-bottom:12px;font-weight:700;letter-spacing:0.5px}
.article .art-meta{font-size:13px;color:var(--muted);margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid var(--border);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.article .art-meta .art-source{color:var(--cyan)}
.article .content{font-size:16px;line-height:2}
.article .content h2{font-size:22px;color:var(--title);margin:36px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);font-weight:600}
.article .content h3{font-size:18px;color:var(--cyan);margin:28px 0 8px;font-weight:600}
.article .content p{margin-bottom:14px}
.article .content ul,.article .content ol{margin:0 0 14px 24px}
.article .content li{margin-bottom:6px}
.article .content blockquote{border-left:3px solid var(--purple);padding:12px 20px;margin:18px 0;background:rgba(155,114,242,0.04);border-radius:0 8px 8px 0;color:var(--muted);font-style:italic}
.article .content code{background:var(--card);padding:2px 8px;border-radius:4px;color:var(--cyan);font-size:0.9em}
.article .content pre{background:#0a0d14;padding:16px 20px;border-radius:var(--radius-sm);overflow-x:auto;margin-bottom:14px;border:1px solid var(--border)}
.article .content pre code{background:none;padding:0;color:var(--text)}
.article .content table{width:100%;border-collapse:collapse;margin:14px 0}
.article .content td,.article .content th{border:1px solid var(--border);padding:10px 14px;text-align:left}
.article .content th{background:var(--card);color:var(--title);font-weight:600;font-size:13px;letter-spacing:1px}
.article .content a{color:var(--cyan)}
.article .content strong{color:var(--title)}
.article .content img{max-width:100%;border-radius:var(--radius-sm)}

/* ====== 浮动按钮 ====== */
#toTop{
  position:fixed;bottom:32px;right:28px;z-index:150;
  width:44px;height:44px;border-radius:50%;
  background:var(--card);border:1px solid var(--border);
  color:var(--muted);cursor:pointer;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:translateY(10px);transition:all 0.35s;
  pointer-events:none;backdrop-filter:blur(8px);
}
#toTop.show{opacity:1;transform:translateY(0);pointer-events:auto}
#toTop:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 6px 24px rgba(34,201,208,0.12)}
.breath-btn{
  position:fixed;bottom:32px;right:80px;z-index:150;
  width:44px;height:44px;border-radius:50%;
  background:var(--card);border:1px solid var(--border);
  color:var(--muted);cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.35s;
}
.breath-btn:hover{border-color:var(--purple);color:var(--purple);box-shadow:0 6px 24px rgba(155,114,242,0.12)}
.breath-overlay{position:fixed;inset:0;background:rgba(8,12,20,0.88);z-index:300;display:none;align-items:center;justify-content:center}
.breath-overlay.on{display:flex}
.breath-circle{width:170px;height:170px;border-radius:50%;border:3px solid var(--purple);margin:0 auto 24px;display:flex;align-items:center;justify-content:center;transition:all 4s ease-in-out;color:var(--title);font-size:18px;letter-spacing:2px}
.breath-circle.inhale{transform:scale(1.5);border-color:var(--cyan);box-shadow:0 0 60px rgba(34,201,208,0.18)}
.breath-circle.hold{border-color:var(--gold)}
.breath-circle.exhale{transform:scale(0.8);border-color:var(--purple)}
.breath-close{color:var(--muted);cursor:pointer;font-size:13px;border:1px solid var(--border);padding:6px 22px;border-radius:16px;background:none;transition:all 0.2s}
.breath-close:hover{color:var(--red);border-color:var(--red)}

.msg{text-align:center;padding:60px 20px;color:var(--muted)}

/* ====== 页脚 ====== */
.footer{text-align:center;padding:36px 24px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);max-width:960px;margin:0 auto;letter-spacing:1px;position:relative;z-index:1}
.footer .days{color:var(--cyan);font-weight:600}

/* 滚动条 */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

@media(max-width:700px){
  .site-name{font-size:28px}
  .quote-card p{font-size:13px;line-height:2}
  .nav-right a span{display:none}
  .nav-tabs button{font-size:12px;padding:5px 10px}
  .post-card h3{font-size:15px}
  .article h1{font-size:23px}
  .stats-row{gap:10px}
  .stat-item{padding:12px 18px}
  .stat-num{font-size:24px}
  .breath-btn{right:76px;bottom:84px}
}
</style>
</head>

<div class="app">

<!-- 星空 -->
<script>
(function(){
  const c=document.getElementById('particles'),ctx=c.getContext('2d');
  let stars=[],w,h;function R(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}R();window.onresize=R;
  for(let i=0;i<80;i++)stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+0.4,o:Math.random(),s:Math.random()*0.004+0.0015});
  (function D(){ctx.clearRect(0,0,w,h);stars.forEach(s=>{s.o+=s.s;if(s.o>1||s.o<0)s.s*=-1;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(155,180,220,${s.o*0.55})`;ctx.fill()});requestAnimationFrame(D)})()
})();
</script>

<script>
// ====== 全局状态 ======
let posts=[],currentTab='all',currentSub='all',currentSearch='',breathTimer=null,riddleAnswer='';
const SITE_START=new Date('2026-05-09');
let rubRate=null;

const SUBS={
  'cross-border':[
    {key:'all',name:'全部'},{key:'selection',name:'📦 选品技巧'},{key:'ozon',name:'🔵 Ozon运营'},
    {key:'yandex',name:'🟡 Yandex运营'},{key:'russia-market',name:'🇷🇺 俄罗斯市场'},
    {key:'logistics',name:'🚚 物流收款'},{key:'tools',name:'🛠 工具教程'},
  ],
  'fitness':[
    {key:'all',name:'全部'},{key:'male',name:'👨 男性训练'},{key:'female',name:'👩 女性训练'},
    {key:'yoga-mat',name:'🧘 瑜伽垫'},{key:'plan',name:'📅 每日计划'},{key:'diet',name:'🥗 饮食建议'},
  ],
  'ai-news':[
    {key:'all',name:'全部'},{key:'ai-tools',name:'🤖 AI工具'},{key:'ai-industry',name:'📡 行业动态'},
    {key:'ai-ecommerce',name:'🛒 AI与电商'},{key:'ai-tutorial',name:'📖 AI教程'},
  ],
};
const SUB_NAMES={};Object.values(SUBS).forEach(a=>a.forEach(s=>SUB_NAMES[s.key]=s.name));

const QUOTE=`你来了，愿你在人海茫茫中，仍能像一朵小小的白云，自由地飘过蓝天，不惊扰任何人，却把自己的洁白与柔软留给这世界。愿你的心永远清澈如山间清泉，无论世事如何喧嚣，都能映照出星光与月色。愿你遇见的每一次风雨，都能化作滋养生命的甘露；愿你走过的每一条路，都开满安静而温柔的花。愿你带着孩子般的纯真与对美好的相信，一路平安，一路向光。`;

// ====== 歇后语库 ======
const XIEHOUYU=[
  ['外甥打灯笼','照旧（舅）'],['孔夫子搬家','尽是输（书）'],['小葱拌豆腐','一清二白'],
  ['哑巴吃黄连','有苦说不出'],['竹篮打水','一场空'],['泥菩萨过江','自身难保'],
  ['飞蛾扑火','自取灭亡'],['狗咬吕洞宾','不识好人心'],['姜太公钓鱼','愿者上钩'],
  ['画蛇添足','多此一举'],['掩耳盗铃','自欺欺人'],['对牛弹琴','白费劲'],
  ['海底捞针','无处寻'],['铁公鸡','一毛不拔'],['千里送鹅毛','礼轻情意重'],
  ['兔子尾巴','长不了'],['热锅上的蚂蚁','团团转'],['茶壶里煮饺子','有口倒不出'],
  ['擀面杖吹火','一窍不通'],['猪八戒照镜子','里外不是人'],['瞎子点灯','白费蜡'],
  ['肉包子打狗','有去无回'],['隔着门缝看人','把人看扁了'],['和尚打伞','无法无天'],
  ['猴子捞月','一场空'],['鸡蛋里挑骨头','找茬'],['老虎屁股','摸不得'],
  ['秋后的蚂蚱','蹦跶不了几天'],['司马昭之心','路人皆知'],['周瑜打黄盖','一个愿打一个愿挨'],
  ['刘备借荆州','有借无还'],['王婆卖瓜','自卖自夸'],['黄鼠狼给鸡拜年','没安好心'],
  ['打破砂锅','问到底'],['芝麻开花','节节高'],['八仙过海','各显神通'],
];

// ====== 字谜库 ======
const ZIMI=[
  ['一口吃掉牛尾巴','告'],['皇帝的新衣','袭'],['一千零一夜','歼'],['秀才进门','闭'],
  ['半青半紫','素'],['争先恐后','急'],['半导体','付'],['吹灯','黑'],
  ['独眼龙','省'],['二月平','朋'],['格外大方','回'],['黄昏','晒'],
  ['九十九','白'],['文武双全','斌'],['一大二小','奈'],['十八子','李'],
  ['三人行','众'],['三日','晶'],['十五天','胖'],['六十天','朋'],
  ['一加一','王'],['一百减一','白'],['七人头上长了草','花'],['一箭穿心','必'],
  ['一人一张口','合'],['山上还有山','出'],['十张口','古'],['一斗米','料'],
  ['一只黑狗不叫不吼','默'],['差一点六斤','兵'],['需要一半留下一半','雷'],
  ['推开又来','摊'],['多一半','夕'],['四方来合作','器'],['守门员','闪'],
  ['没有人','门'],['刀出鞘','力'],['打断念头','心'],['手提包','抱'],
];

// ====== 数据加载 ======
async function fetchRate(){try{const r=await fetch('https://open.er-api.com/v6/latest/CNY');rubRate=(await r.json()).rates?.RUB||null}catch(e){}}
function catName(c){const m={'cross-border':'跨境电商','fitness':'每日健身','ai-news':'AI新闻'};return m[c]||c}
function readTime(t){return Math.max(1,Math.ceil((t||'').length/8))+' 分钟阅读'}

async function loadData(){
  try{const r=await fetch('posts/posts.json?v='+Date.now());if(!r.ok)throw Error('HTTP '+r.status);posts=await r.json();posts.sort((a,b)=>b.date.localeCompare(a.date));return true}
  catch(e){console.error(e);return false}
}

// ====== 工具函数 ======
let todayXHY=null,todayZM=null;
function pickXHY(){const x=XIEHOUYU[Math.floor(Math.random()*XIEHOUYU.length)];todayXHY={q:x[0],a:x[1],show:false}}
function pickZM(){const z=ZIMI[Math.floor(Math.random()*ZIMI.length)];todayZM={q:z[0],a:z[1]};riddleAnswer=z[1]}

// ====== 渲染 ======
function render(){
  let filtered=posts;
  if(currentTab!=='all')filtered=filtered.filter(p=>p.cat===currentTab);
  if(currentSub!=='all')filtered=filtered.filter(p=>p.sub===currentSub);
  if(currentSearch){const q=currentSearch.toLowerCase();filtered=filtered.filter(p=>p.title.toLowerCase().includes(q)||p.excerpt.toLowerCase().includes(q))}

  const isHome=currentTab==='all'&&currentSub==='all'&&!currentSearch;
  const days=Math.ceil((Date.now()-SITE_START)/86400000);
  const main=document.getElementById('main');
  if(!todayXHY)pickXHY();
  if(!todayZM)pickZM();

  let html='';

  // Hero
  html+=`<section class="hero"><div class="site-name">猫明之主小站</div><div class="site-desc">跨境电商 & 健身 & AI · 安静学习，温柔生长</div></section>`;

  // 引言（首页）
  if(isHome){
    html+=`<div class="quote-wrap"><div class="quote-card"><span class="qm">"</span><p>${QUOTE}</p><div class="q-act"><button onclick="copyQuote()">📋 复制</button><button onclick="pickXHY();pickZM();render()">🎲 换一换</button></div></div></div>`;
  }

  // 小工具行
  const now=new Date();
  const weekDays=['日','一','二','三','四','五','六'];
  const dateStr=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${weekDays[now.getDay()]}`;
  const lunarInfo=['🌑 新月','🌒 蛾眉月','🌓 上弦月','🌔 盈凸月','🌕 满月','🌖 亏凸月','🌗 下弦月','🌘 残月'];
  const fakeLunar=lunarInfo[Math.floor((now.getDate()/31)*8)%8];

  html+=`<div class="tools-row">`;
  // 日期卡片
  html+=`<div class="tool-card date-card"><div class="t-label">今日</div><div class="t-main">${dateStr}</div><div class="t-sub">${fakeLunar} · 安静的一天</div></div>`;
  // 歇后语卡片
  html+=`<div class="tool-card"><div class="t-label">歇后语</div><div class="t-main">${todayXHY.q}</div><div class="t-sub">${todayXHY.show?todayXHY.a:'🤔 猜猜后面是什么？'}</div><button class="t-action" onclick="revealXHY()">${todayXHY.show?'换一个':'看答案'}</button></div>`;
  // 猜字谜卡片
  html+=`<div class="tool-card riddle-card"><div class="t-label">猜字谜</div><div class="t-main">${todayZM.q}</div><input class="t-input" id="riddleInput" placeholder="输入你的答案..." onkeydown="if(event.key==='Enter')checkRiddle()"><div class="t-feedback" id="riddleFeedback"></div></div>`;
  html+=`</div>`;

  // 统计
  const counts={};
  for(let t of['cross-border','fitness','ai-news'])counts[t]=posts.filter(p=>p.cat===t).length;
  html+=`<div class="stats-row"><div class="stat-item"><div class="stat-num">${posts.length}</div><div class="stat-label">全部文章</div></div><div class="stat-item"><div class="stat-num">${counts['cross-border']}</div><div class="stat-label">跨境电商</div></div><div class="stat-item"><div class="stat-num">${counts['fitness']}</div><div class="stat-label">每日健身</div></div><div class="stat-item"><div class="stat-num">${counts['ai-news']}</div><div class="stat-label">AI新闻</div></div></div>`;

  // 子分类
  if(currentTab!=='all'){
    const subs=SUBS[currentTab]||[];
    html+='<div class="sub-row">';
    subs.forEach(s=>html+=`<button class="sub-btn${currentSub===s.key?' on':''}" onclick="switchSub('${s.key}')">${s.name}</button>`);
    html+='</div>';
  }

  // 汇率信息
  html+=`<div style="text-align:center;margin-bottom:18px;font-size:12px;color:var(--muted)">💱 1 CNY ≈ <span style="color:var(--gold);font-weight:600">${rubRate?rubRate.toFixed(2):'--'}</span> RUB · 小站已运行 <span style="color:var(--cyan);font-weight:600">${days}</span> 天</div>`;

  // 搜索
  html+=`<div class="search-wrap"><input id="searchInput" placeholder="🔍 搜索文章..." value="${currentSearch.replace(/"/g,'&quot;')}" oninput="onSearch(this.value)"></div>`;

  // 文章列表
  if(!filtered.length){
    html+='<div class="msg">✨ 暂无文章，等待内容更新</div>';
  }else{
    html+='<div class="post-grid">';
    filtered.forEach(p=>{
      const colors={'cross-border':'var(--cyan)','fitness':'var(--green)','ai-news':'var(--purple)'};
      const color=colors[p.cat]||'var(--cyan)';
      html+=`<article class="post-card" onclick="showArticle('${p.slug}','${p.cat}')"><div class="p-meta"><span class="p-tag" style="background:${color}22;color:${color}">${SUB_NAMES[p.sub]||catName(p.cat)}</span><span class="p-date">${p.date}</span><span class="p-read">${readTime(p.title)}</span></div><h3>${p.title}</h3><p class="p-excerpt">${p.excerpt||''}</p></article>`;
    });
    html+='</div>';
  }

  main.innerHTML=html;
  main.style.animation='fadeIn 0.4s ease-out';

  document.getElementById('footer').innerHTML=`© 2026 猫明之主小站 · 已安静运行 <span class="days">${days}</span> 天 · <a href="javascript:startBreath()" style="color:var(--muted);text-decoration:none">🧘 呼吸放松</a>`;
}

// ====== 交互 ======
function copyQuote(){navigator.clipboard.writeText(QUOTE).then(()=>{const b=document.querySelector('.q-act button');b.textContent='✓ 已复制';b.classList.add('done');setTimeout(()=>{b.textContent='📋 复制';b.classList.remove('done')},2000)}).catch(()=>{})}
function revealXHY(){if(todayXHY.show){pickXHY();render()}else{todayXHY.show=true;render()}}
function checkRiddle(){
  const input=document.getElementById('riddleInput'),fb=document.getElementById('riddleFeedback');
  if(!input||!fb)return;
  const val=input.value.trim();
  if(!val)return;
  if(val===riddleAnswer){fb.textContent='✅ 答对了！';fb.className='t-feedback correct';setTimeout(()=>{pickZM();render()},1500)}
  else{fb.textContent='❌ 不对哦，再试试';fb.className='t-feedback wrong'}
}

function switchTab(tab){currentTab=tab;currentSub='all';currentSearch='';document.querySelectorAll('.nav-tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));render();window.scrollTo(0,0)}
function switchSub(sub){currentSub=sub;render()}
function onSearch(v){currentSearch=v.trim();render()}

// ====== 文章详情 ======
async function showArticle(slug,cat){
  const main=document.getElementById('main');main.innerHTML='<div class="msg">🕯 加载中...</div>';window.scrollTo(0,0);
  try{
    const r=await fetch('posts/'+slug+'.md');if(!r.ok)throw Error('404');
    const md=await r.text(),post=posts.find(p=>p.slug===slug);
    const colors={'cross-border':'var(--cyan)','fitness':'var(--green)','ai-news':'var(--purple)'};
    const color=colors[cat]||'var(--cyan)';
    const toc=buildTOC(md);
    main.innerHTML=`<div class="article"><span class="back-btn" onclick="switchTab('${cat}')">← 返回${catName(cat)}</span><h1>${post?.title||''}</h1><div class="art-meta"><span style="color:${color}">${SUB_NAMES[post?.sub]||catName(cat)}</span><span>·</span><span>${post?.date||''}</span><span>·</span><span>${readTime(md)}</span>${post?.source_name?`<span>·</span><span class="art-source">📰 ${post.source_name}</span>`:''}</div>${toc}<div class="content">${marked.parse(md)}</div></div>`;
  }catch(e){main.innerHTML=`<div class="msg">加载失败 <a href="javascript:switchTab('${cat}')" style="color:var(--cyan)">返回</a></div>`}
}

function buildTOC(md){
  const headings=[...md.matchAll(/^(#{2,3})\s+(.+)$/gm)];
  if(headings.length<2)return'';
  let h='<nav class="toc"><div class="toc-title">📑 目录</div>';
  headings.forEach(m=>{const lv=m[1].length,text=m[2],id=text.replace(/[^\w一-鿿]/g,'-').toLowerCase();h+=`<a class="${lv===3?'toc-h3':''}" href="javascript:document.getElementById('${id}').scrollIntoView({behavior:'smooth'})">${lv===2?'●':'◦'} ${text}</a>`});
  h+='</nav>';return h;
}

marked.use({renderer:{heading(t){const id=t.text.replace(/[^\w一-鿿]/g,'-').toLowerCase();return`<h${t.depth} id="${id}">${t.text}</h${t.depth}>`}}});

function goHome(){switchTab('all')}

// ====== 滚动监听 ======
window.addEventListener('scroll',()=>{
  const h=document.documentElement.scrollHeight-window.innerHeight;
  document.getElementById('progress-bar').style.width=h>0?Math.min(100,Math.round(window.scrollY/h*100))+'%':'0%';
  document.getElementById('toTop').classList.toggle('show',window.scrollY>400);
});

// ====== 呼吸 ======
function startBreath(){document.getElementById('breathOverlay').classList.add('on');runBreath()}
function stopBreath(){document.getElementById('breathOverlay').classList.remove('on');clearTimeout(breathTimer);const c=document.getElementById('breathCircle');c.textContent='准备';c.className='breath-circle'}
function runBreath(){
  const c=document.getElementById('breathCircle');let p=0;
  const ph=[{t:'吸气',cl:'breath-circle inhale',d:4000},{t:'屏息',cl:'breath-circle hold',d:2000},{t:'呼气',cl:'breath-circle exhale',d:4000},{t:'静息',cl:'breath-circle',d:2000}];
  (function tick(){const x=ph[p%4];c.textContent=x.t;c.className=x.cl;p++;breathTimer=setTimeout(tick,x.d)})()
}
document.getElementById('breathOverlay').onclick=function(e){if(e.target===this)stopBreath()};
document.getElementById('breathBtn').onclick=startBreath;

// ====== 启动 ======
(async function(){
  pickXHY();pickZM();
  await Promise.all([loadData(),fetchRate()]);
  render();
})();
</script>
