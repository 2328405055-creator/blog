<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习仪表盘</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg: #0a0e17; --card: #111827; --border: #1e293b;
  --text: #c8d2e0; --title: #e8edf5; --muted: #6b7d99;
  --blue: #3b82f6; --cyan: #06b6d4; --green: #10b981;
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.7; min-height:100vh; }
.nav { background:rgba(10,14,23,0.94); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; }
.nav-inner { max-width:800px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:0 20px; height:56px; }
.nav .logo { font-size:17px; font-weight:700; color:var(--title); cursor:pointer; text-decoration:none; }
.nav .logo span { color:var(--cyan); }
.nav-tabs { display:flex; gap:4px; }
.nav-tabs button { padding:6px 16px; border-radius:16px; border:1px solid var(--border); background:var(--card); color:var(--muted); cursor:pointer; font-size:13px; transition:all 0.2s; }
.nav-tabs button:hover { border-color:var(--blue); color:var(--blue-light); }
.nav-tabs button.on { background:var(--blue); border-color:var(--blue); color:#fff; }
.main { max-width:800px; margin:0 auto; padding:0 20px 60px; }
.hero { text-align:center; padding:40px 0 24px; }
.hero h1 { font-size:26px; color:var(--title); }
.hero p { color:var(--muted); font-size:14px; margin-top:6px; }
.stats { display:flex; gap:20px; justify-content:center; margin-bottom:24px; }
.stats .s { text-align:center; }
.stats .s .n { font-size:24px; font-weight:700; color:var(--cyan); }
.stats .s .l { font-size:11px; color:var(--muted); }
.sub-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
.sub-row button { padding:5px 14px; border-radius:14px; border:1px solid var(--border); background:var(--card); color:var(--muted); cursor:pointer; font-size:12px; transition:all 0.2s; }
.sub-row button:hover, .sub-row button.on { border-color:var(--blue); color:var(--blue); }
.sub-row button.on { background:rgba(59,130,246,0.1); }
.search { margin-bottom:18px; }
.search input { width:100%; padding:10px 16px; border-radius:18px; border:1px solid var(--border); background:var(--card); color:var(--title); font-size:14px; outline:none; }
.search input:focus { border-color:var(--blue); }
.search input::placeholder { color:var(--muted); }
.list { display:grid; gap:14px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; cursor:pointer; transition:all 0.25s; }
.card:hover { background:#1a2235; border-color:var(--blue); transform:translateY(-2px); }
.card .row1 { display:flex; align-items:center; gap:10px; margin-bottom:4px; font-size:13px; }
.card .tag { padding:2px 10px; border-radius:10px; font-size:11px; }
.card .date { color:var(--muted); }
.card h3 { font-size:17px; color:var(--title); margin-bottom:4px; }
.card .excerpt { font-size:13px; color:var(--muted); }
.article { padding:20px 0; }
.article .back { display:inline-flex; align-items:center; gap:4px; color:var(--muted); cursor:pointer; font-size:14px; margin-bottom:20px; }
.article .back:hover { color:var(--blue); }
.article h1 { font-size:26px; color:var(--title); line-height:1.3; margin-bottom:8px; }
.article .meta { font-size:13px; color:var(--muted); margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid var(--border); }
.article .content { font-size:16px; line-height:1.9; }
.article .content h2 { font-size:20px; color:var(--title); margin:24px 0 10px; }
.article .content h3 { font-size:17px; color:var(--cyan); margin:20px 0 8px; }
.article .content p { margin-bottom:12px; }
.article .content ul,.article .content ol { margin:0 0 12px 22px; }
.article .content li { margin-bottom:4px; }
.article .content blockquote { border-left:3px solid var(--blue); padding:8px 16px; margin:14px 0; background:rgba(59,130,246,0.05); border-radius:0 6px 6px 0; color:var(--muted); }
.article .content code { background:var(--card); padding:2px 6px; border-radius:4px; color:var(--cyan); }
.article .content pre { background:#0d1117; padding:14px 18px; border-radius:8px; overflow-x:auto; margin-bottom:12px; border:1px solid var(--border); }
.article .content table { width:100%; border-collapse:collapse; margin:12px 0; }
.article .content td,.article .content th { border:1px solid var(--border); padding:8px 12px; }
.article .content th { background:var(--card); color:var(--title); }
.article .content a { color:var(--blue); }
.article .content strong { color:var(--title); }
.msg { text-align:center; padding:60px 20px; color:var(--muted); }
.footer { text-align:center; padding:30px; color:var(--muted); font-size:12px; border-top:1px solid var(--border); max-width:800px; margin:0 auto; }
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <span class="logo" onclick="showHome()">📚 学习<span>仪表盘</span></span>
    <div class="nav-tabs">
      <button class="on" data-tab="all" onclick="switchTab('all')">全部</button>
      <button data-tab="cross-border" onclick="switchTab('cross-border')">🚀 跨境电商</button>
      <button data-tab="fitness" onclick="switchTab('fitness')">💪 每日健身</button>
    </div>
  </div>
</nav>

<div class="main" id="main"></div>

<footer class="footer">© 2026 学习仪表盘 · 持续积累</footer>

<script>
// ---- 全局状态 ----
let posts = [];
let currentTab = 'all';
let currentSub = 'all';
let currentSearch = '';

const SUBS = {
  'cross-border': [
    {key:'all',name:'全部'},{key:'selection',name:'选品技巧'},{key:'ozon',name:'Ozon运营'},
    {key:'yandex',name:'Yandex运营'},{key:'russia-market',name:'俄罗斯市场'},
    {key:'logistics',name:'物流收款'},{key:'tools',name:'工具教程'},
  ],
  'fitness': [
    {key:'all',name:'全部'},{key:'male',name:'男性训练'},{key:'female',name:'女性训练'},
    {key:'yoga-mat',name:'瑜伽垫动作'},{key:'plan',name:'每日计划'},{key:'diet',name:'饮食建议'},
  ],
};

const SUB_NAMES = {};
Object.values(SUBS).forEach(arr => arr.forEach(s => SUB_NAMES[s.key] = s.name));
for (let k in SUBS) SUB_NAMES[k] = '';

// ---- 数据加载 ----
async function loadData() {
  try {
    const r = await fetch('posts/posts.json?v=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    posts = await r.json();
    posts.sort((a,b) => b.date.localeCompare(a.date));
    return true;
  } catch(e) {
    console.error('加载失败:', e);
    return false;
  }
}

// ---- 渲染 ----
function render() {
  let filtered = posts;

  // 栏目筛选
  if (currentTab !== 'all') {
    filtered = filtered.filter(p => p.cat === currentTab);
  }

  // 子分类筛选
  if (currentSub !== 'all') {
    filtered = filtered.filter(p => p.sub === currentSub);
  }

  // 搜索
  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    filtered = filtered.filter(p =>
      p.title.toLowerCase().includes(q) || p.excerpt.toLowerCase().includes(q)
    );
  }

  const main = document.getElementById('main');
  const crossCount = posts.filter(p => p.cat === 'cross-border').length;
  const fitCount = posts.filter(p => p.cat === 'fitness').length;

  // 统计栏
  let statsHTML = `
    <div class="hero">
      <h1>📚 学习仪表盘</h1>
      <p>跨境电商实战 + 每日健身，持续积累</p>
    </div>
    <div class="stats">
      <div class="s"><div class="n">${posts.length}</div><div class="l">文章总数</div></div>
      <div class="s"><div class="n">${crossCount}</div><div class="l">跨境电商</div></div>
      <div class="s"><div class="n">${fitCount}</div><div class="l">每日健身</div></div>
    </div>
  `;

  // 子分类按钮
  let subHTML = '';
  const subs = SUBS[currentTab === 'all' ? 'cross-border' : currentTab] || [];
  if (currentTab !== 'all') {
    subHTML = '<div class="sub-row">';
    subs.forEach(s => {
      subHTML += `<button class="${currentSub===s.key?'on':''}" onclick="switchSub('${s.key}')">${s.name}</button>`;
    });
    subHTML += '</div>';
  }

  // 搜索
  let searchHTML = `<div class="search"><input type="text" id="searchInput" placeholder="🔍 搜索文章..." value="${currentSearch.replace(/"/g,'&quot;')}" oninput="onSearch(this.value)"></div>`;

  // 文章列表
  let listHTML = '';
  if (filtered.length === 0) {
    listHTML = '<div class="msg">暂无文章</div>';
  } else {
    listHTML = '<div class="list">';
    filtered.forEach(p => {
      const color = currentTab === 'fitness' ? 'var(--green)' : 'var(--blue)';
      listHTML += `
        <div class="card" onclick="showArticle('${p.slug}','${p.cat}')">
          <div class="row1">
            <span class="tag" style="background:${color}22;color:${color}">${SUB_NAMES[p.sub]||catName(p.cat)}</span>
            <span class="date">${p.date}</span>
          </div>
          <h3>${p.title}</h3>
          <p class="excerpt">${p.excerpt||''}</p>
        </div>
      `;
    });
    listHTML += '</div>';
  }

  main.innerHTML = statsHTML + subHTML + searchHTML + listHTML;
}

function catName(cat) {
  return cat === 'cross-border' ? '跨境电商' : cat === 'fitness' ? '每日健身' : cat;
}

// ---- 交互 ----
function switchTab(tab) {
  currentTab = tab;
  currentSub = 'all';
  currentSearch = '';
  document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('on'));
  document.querySelector(`[data-tab="${tab}"]`).classList.add('on');
  render();
  window.scrollTo(0,0);
}

function switchSub(sub) {
  currentSub = sub;
  render();
}

function onSearch(val) {
  currentSearch = val.trim();
  render();
}

async function showArticle(slug, cat) {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="msg">加载中...</div>';
  window.scrollTo(0,0);

  try {
    const r = await fetch('posts/' + slug + '.md');
    if (!r.ok) throw new Error('404');
    const md = await r.text();
    const post = posts.find(p => p.slug === slug);
    const color = cat === 'fitness' ? 'var(--green)' : 'var(--blue)';
    main.innerHTML = `
      <div class="article">
        <div class="back" onclick="switchTab('${cat}')">← 返回${catName(cat)}</div>
        <h1>${post?.title||''}</h1>
        <div class="meta">
          <span style="color:${color}">${SUB_NAMES[post?.sub]||catName(cat)}</span>
          <span> · </span><span>${post?.date||''}</span>
          ${post?.source_name ? `<span> · 来源：${post.source_name}</span>` : ''}
        </div>
        <div class="content">${marked.parse(md)}</div>
      </div>
    `;
  } catch(e) {
    main.innerHTML = `<div class="msg">加载失败 <a href="javascript:switchTab('${cat}')">返回</a></div>`;
  }
}

function showHome() {
  switchTab('all');
}

// ---- 初始化 ----
(async function(){
  const ok = await loadData();
  if (!ok) {
    document.getElementById('main').innerHTML = '<div class="msg">文章加载失败，请刷新重试</div>';
    return;
  }
  render();
})();
</script>

</body>
</html>
